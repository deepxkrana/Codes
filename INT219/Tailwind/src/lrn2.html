<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-r from-red-800 to-red-500 flex flex-col">
    <header class="relative bg-black w-full p-3">
        <nav class="flex flex-col items-center mx-auto text-white text-xl ">
             <p class="text-white text-2xl text-center">My Website</p>
                <ul class="flex gap-4 mt-2">
                    <li><a href="#" class="hover:text-red-500">Home</a></li>
                    <li><a href="#" class="hover:text-red-500">About</a></li>
                    <li><a href="#" class="hover:text-red-500">Gallary</a></li>
                    <li><a href="#" class="hover:text-red-500">Contact</a></li>
                </ul>
        </nav>
    </header>
    <main class="flex-grow">
        <div class="bg-gradient-to-r from-green-800 to-green-400 flex flex-col text-3xl mt-3 mx-auto m items-center max-w-md w-96 border-blue-400 rounded-lg shadow-2xl overflow-hidden border-dashed border-4">
            <img src="cat-3059075_1280.jpg" alt="cat Image" class="mt-0 object-cover">
            <h1 class="text-black text-3xl mt-3">The Card</h1>
            <div class="grid grid-cols-4 justify-center mx-auto gap-7 w-80 mt-3 mb-3">
                <p class="p-4 bg-white col-span-2 rounded-lg text-center">Car</p>
                <p class="p-4 bg-white col-span-2 rounded-lg text-center">Bike</p>
                <p class="p-4 bg-white col-span-2 col-start-2 rounded-lg text-center">Bike</p>
            </div>
            <button class="py-3 px-6 rounded-3xl bg-amber-300 mt-4 mb-4 hover:bg-amber-700 shadow-2xl">Yeasss</button>
        </div>
        <div class="mt-4 p-4">
        <form class="max-w-md mx-auto p-6 bg-white rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4 text-center">Contact Us</h2>
            <label class="block mb-2 font-medium" for="name">Name</label>
            <input type="text" id="name" name="name" class="w-full p-2 mb-4 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Your Name" required>
            <label class="block mb-2 font-medium" for="email">Email</label>
            <input type="email" id="email" name="email" class="w-full p-2 mb-4 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="you@example.com" required>
            <label class="block mb-2 font-medium" for="message">Message</label>
            <textarea id="message" name="message" rows="4" class="w-full p-2 mb-4 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Your Message" required></textarea>
            <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 transition duration-300">Submit</button>
        </form>
    </div>
    </main>
    <footer class="bg-black flex mx-auto justify-center text-white text-xl p-3 w-full mt-auto">
        <p>&copy All Rights Reserved | Deepak Rana</p>
    </footer>
</body>
</html>
