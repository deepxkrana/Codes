<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My ID Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans bg-gray-200 flex justify-center items-center min-h-screen">
    <div id="idCardContainer">
        <!-- The ID card will be injected here by JavaScript -->
    </div>

    <script>
        const idCardJSON = `{
            "name": "Deepak Rana",
            "regNo": "12301183",
            "section": "K23CC",
            "university": "Lovely Professional University",
            "photoUrl": "cat.jpg"
        }`;

        const details = JSON.parse(idCardJSON);

        const idCardHTML = `
            <div class="w-80 bg-white rounded-2xl shadow-xl overflow-hidden text-center">
                <div class="bg-blue-700 h-24 relative">
                    <img src="${details.photoUrl}" alt="Profile Photo" class="w-28 h-28 rounded-full border-4 border-white object-cover absolute -bottom-14 left-1/2 -translate-x-1/2">
                </div>
                <div class="p-4 pt-20">
                    <h2 class="text-xl font-bold text-blue-900">${details.university}</h2>
                    <p class="mt-2 text-gray-600">Name: <span class="font-semibold text-gray-800">${details.name}</span></p>
                    <p class="mt-2 text-gray-600">Regn No: <span class="font-semibold text-gray-800">${details.regNo}</span></p>
                    <p class="mt-2 text-gray-600">Section: <span class="font-semibold text-gray-800">${details.section}</span></p>
                </div>
            </div>
        `;

        document.getElementById('idCardContainer').innerHTML = idCardHTML;
    </script>
</body>
</html>
