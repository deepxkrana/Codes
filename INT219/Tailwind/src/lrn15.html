<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON on Webpage</title>
    <script src="/INT219/Tailwind/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <div id="output"></div>
    <script>
        $(function(){
            const data = {name: "AB", age: 20}
            $('#output').text("NAME :"+ data.name + ", AGE :"+ data.age);
        })
    </script>
</body>
</html>
