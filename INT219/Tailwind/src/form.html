<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <h1 class="text-center">Registration Form</h1>
    <form class="max-w-md bg-white p-6 rounded shadow-md mx-auto space-y-4">
        <!-- Full Name -->
         <div>
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>
         </div>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <!-- Gender (Radio Buttons) -->
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <!-- Hobbies (Checkboxes) -->
        <label>Hobbies:</label>
        <input type="checkbox" id="reading" name="hobbies" value="reading">
        <label for="reading">Reading</label>
        <input type="checkbox" id="traveling" name="hobbies" value="traveling">
        <label for="traveling">Traveling</label><br><br>

        <label for="subject">Subject:</label>
        <select name="subject" id="subject">
            <option value="math">Mathematics</option>
            <option value="science">Science</option>
            <option value="english">English</option>
        </select>
        <br><br>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" cols="10" placeholder="Enter your message here..."></textarea>
        <br><br>
        <!-- Submit Button -->
        <button type="submit" class="bg-blue-600 px-6 py-2 rounded-md mt-5">Submit</button>
    </form>
</body>
</html>
