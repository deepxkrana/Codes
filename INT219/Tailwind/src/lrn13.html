<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="/INT219/Tailwind/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md">
        <form id="myForm" class="bg-white shadow-lg rounded-lg px-8 pt-6 pb-8 mb-4">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Form Validation</h2>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="name">Name:</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="text" id="name" placeholder="Enter Name" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email:</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="email" id="email" placeholder="Enter Email">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password:</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="password" id="password" placeholder="Enter Password">
            </div>
            <input class="w-full bg-red-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit" value="Submit">
        </form>
    </div>
    <script>
        $(document).ready(function(){
            $('#myForm').submit(function(event){
                let name = $('#name').val().trim();
                let email = $('#email').val().trim();
                let password = $('#password').val();

                if(name === "" || email === "" || password === ""){
                    alert("All fields are required.");
                    event.preventDefault(); // Prevent form submission
                    return;
                }
                let emailPattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
                if(!email.match(emailPattern)){
                    alert("Please enter a valid email address.");
                    event.preventDefault(); // Prevent form submission
                    return;
                }
                let passwordPattern=/^(?=.*[0-9])(?=.*[!@#$%^&*])[a-zA-Z0-9!@#$%^&*]{6,16}$/;
                if(!password.match(passwordPattern)){
                    alert("Password must be 6-16 characters long and include at least one number and one special character.");
                    event.preventDefault(); // Prevent form submission
                    return;
                }
                alert("Form submitted successfully!");
                // Form will submit as event.preventDefault() was not called
            });
        });
    </script>
</body>
</html>
