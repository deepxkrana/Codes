<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans">
    <div id="quizbox" class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 text-center">
        <h2 id="questionText" class="text-2xl font-bold mb-6 text-gray-800"></h2>
        <div id="optionsContainer">
            <!-- Options will be dynamically styled by JS -->
            <div id="option0" onclick="checkAnswer(0)"></div>
            <div id="option1" onclick="checkAnswer(1)"></div>
            <div id="option2" onclick="checkAnswer(2)"></div>
            <div id="option3" onclick="checkAnswer(3)"></div>
        </div>
        <button id="nextButton" onclick="nextQuestion()" class="bg-blue-600 text-white rounded-lg py-2 px-6 text-lg cursor-pointer mt-5 hidden hover:bg-blue-700 transition-colors">Next Question</button>
        <div id="result" class="text-2xl font-bold mt-6"></div>
    </div>

    <script>
        let quizData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answerSelected = false;

        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const nextButton = document.getElementById('nextButton');
        const resultDiv = document.getElementById('result');

        const optionBaseClasses = "option bg-gray-100 border-2 border-gray-300 rounded-lg p-3 my-2 cursor-pointer transition-all hover:bg-gray-200";
        const correctClasses = "bg-green-100 border-green-500 text-green-700 font-semibold";
        const incorrectClasses = "bg-red-100 border-red-500 text-red-700 font-semibold";

        function loadQuestion() {
            answerSelected = false;
            const currentQuestion = quizData[currentQuestionIndex];
            questionText.innerText = currentQuestion.question;

            for (let i = 0; i < currentQuestion.options.length; i++) {
                const optionDiv = document.getElementById(`option${i}`);
                optionDiv.innerText = currentQuestion.options[i]; // Set text
                optionDiv.className = optionBaseClasses; // Reset to base classes
                optionDiv.style.pointerEvents = 'auto'; // Re-enable clicks
            }
            nextButton.style.display = 'none';
        }

        function checkAnswer(selectedIndex) {
            if (answerSelected) return;
            answerSelected = true;

            const currentQuestion = quizData[currentQuestionIndex];
            const correctIndex = currentQuestion.answer;

            if (selectedIndex === correctIndex) {
                score++;
                const selectedOption = document.getElementById(`option${selectedIndex}`);
                selectedOption.className = `${optionBaseClasses} ${correctClasses}`;
            } else {
                const selectedOption = document.getElementById(`option${selectedIndex}`);
                selectedOption.className = `${optionBaseClasses} ${incorrectClasses}`;

                const correctOption = document.getElementById(`option${correctIndex}`);
                correctOption.className = `${optionBaseClasses} ${correctClasses}`;
            }

            for (let i = 0; i < currentQuestion.options.length; i++) {
                document.getElementById(`option${i}`).style.pointerEvents = 'none';
            }

            nextButton.style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showScore();
            }
        }

        function showScore() {
            questionText.innerText = "Quiz Finished!";
            optionsContainer.innerHTML = ""; // Clear options
            nextButton.style.display = "none";
            resultDiv.innerText = `Your score is ${score} out of ${quizData.length}.`;
        }

        async function startQuiz() {
            try {
                const response = await fetch('quiz-data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                quizData = await response.json();
                loadQuestion();
            } catch (error) {
                console.error('Failed to load quiz data:', error);
                questionText.innerText = 'Failed to load quiz. Please check the console for errors.';
            }
        }

        startQuiz();
    </script>
</body>
</html>
