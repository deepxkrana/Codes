<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <h1 class="text=3xl bg-blue-500 font-bold underline text-center text-white">
       Hello World 
    </h1>
    <div class="bg-blue-300 rounded-lg w-md inset-shadow-sm inset-shadow-indigo-200">INT219</div>
    <br>
    <section class="mb-12">
        <h2 class="text-6xl font-bold mb-4">This is heading</h2>
        <p class="text-amber-800 mb-4 text-5xl">This is a part</p>
        <!-- <p class="text-lg font" -->
    </section>
    <div class="flex space-x-4">
        <ul>
            <li class="bg-red-500 text-white p-4 rounded-lg shadow-lg hover:bg-red-700 transition duration-300">Item 1</li>
            <li class="bg-green-500 text-white p-4 rounded-lg shadow-lg hover:bg-green-700 transition duration-300">Item 2</li>
            <li class="bg-blue-500 text-white p-4 rounded-lg shadow-lg hover:bg-blue-700 transition duration-300">Item 3</li>
        </ul>
        <ol>
            <li class="text-2xl text-white bg-green-500 p-4 rounded-full text-center mb-2 shadow-lg hover:bg-green-700 transition duration-300 transform hover:scale-110">First</li>
            <li class="text-2xl text-white p-4 bg-red-500 p-4 rounded-mb shadow-lg hover:bg-red-700 transition duration-300">Second</li>
            <li class="text-2xl text-white p-4 bg-blue-500 p-4 rounded-lg shadow-lg hover:bg-blue-700 transition duration-300">Third</li>
        </ol>
    </div>
    <div>
        <table class="w-full">
            <thead class="text-5xl text-center bg-green-600 text-white border border-blue-900"> Grocery List</thead>
            <tr class="bg-gray-200">
                <th class="text-2xl border border-green-400 px-4 py-2">Item</th>
                <th class="text-2xl border border-blue-900 px-4 py-2">Quantity</th>
                <th class="text-2xl border border-gray-400 px-4 py-2">Price</th>
            </tr>
            <tdr class="bg-white">
                <td class="text-2xl border border-green-400 px-4 py-2">Apples</td>
                <td class="text-2xl border border-blue-900 px-4 py-2">5</td>
                <td class="text-2xl border border-gray-400 px-4 py-2">$3.00</td>
            </tdr>
            <tdr class="bg-gray-100">
                <td class="text-2xl border border-green-400 px-4 py-2">Bananas</td>
                <td class="text-2xl border border-blue-900 px-4 py-2">7</td>
                <td class="text-2xl border border-gray-400 px-4 py-2">$2.50</td>
            </tdr>
        </table>
    </div>
</body>
</html>
