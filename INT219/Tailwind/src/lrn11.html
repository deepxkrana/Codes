<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Change Box Color</h1>
    <div id="colorbox" style="width:200px; height:200px; background-color:lightgray; display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:10px;">
        Color Box
    </div>
    <button id="changecolorbtn">Change Color</button>
    <script>
        let button= document.getElementById("changecolorbtn");
        let box= document.getElementById("colorbox");
         let colors=["red", "blue", "green", "yellow", "purple", "orange"];
         button.addEventListener("click",function(){
            let randomColor= colors[Math.floor(Math.random()*colors.length)];
            box.style.backgroundColor=randomColor;
            box.innerText=randomColor;
         })
    </script>
</body>
</html>
