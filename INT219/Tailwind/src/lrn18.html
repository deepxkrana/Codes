<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-gray-100">
    <!-- Header -->
    <header class="bg-blue-700 text-white shadow-lg">
        <div class="container mx-auto px-6 py-6">
            <div class="flex items-center justify-between">
                <h1 class="text-3xl font-bold">My Page</h1>
                <nav class="hidden md:flex space-x-6">
                    <a href="#" class="hover:text-orange-200">Home</a>
                    <a href="#" class="hover:text-orange-200">Gallery</a>
                    <a href="#" class="hover:text-orange-200">About</a>
                </nav>
            </div>
        </div>
    </header>

    <div class="max-w-6xl mx-auto grid grid-cols-3 gap-8 p-4 mt-6 rounded-xl">
        <div class="bg-white shadow-lg rounded-lg overflow-hidden">
            <img src="restraunt.jpg" class="w-full h-56 object-cover">
            <div class="p-4">
                <h2 class="text-xl font-bold">CARD1</h2>
                <p class="text-gray-600">This is the para 1</p>
            </div>
        </div>
        
        <div class="bg-white shadow-lg rounded-lg overflow-hidden">
            <img src="restraunt.jpg" class="w-full h-56 object-cover">
            <div class="p-4">
                <h2 class="text-xl font-bold">CARD2</h2>
                <p class="text-gray-600">This is the para 2</p>
            </div>
        </div>

        <div class="bg-white shadow-lg rounded-lg overflow-hidden">
            <img src="restraunt.jpg" class="w-full h-56 object-cover">
            <div class="p-4">
                <h2 class="text-xl font-bold">CARD3</h2>
                <p class="text-gray-600">This is the para 3</p>
            </div>
        </div>
    </div>

    <section class="max-w-xl mx-auto bg-white shadow-lg rounded-lg p-4 mb-10 mt-6">
        <h2 class="text-2xl font-bold text-center mb-4">Contact Form</h2>
        <form>
            <label class="block mb-2 font-semibold">Name</label>
            <input type="text" class="w-full border rounded px-3 py-2 mb-2" placeholder="Enter Your name">
            <label class=" block mb-2 font-semibold">Email</label>
            <input type="email" class="w-full border rounded px-3 py-2 mb-2" placeholder="Enter your email">
            <label class="block mb-2 font-semibold">Message</label>
            <textarea class="w-full border rounded px-3 py-2 mb-2" rows="4" placeholder="Enter Your Message"></textarea>
            <button class="w-full bg-blue-700 text-white py-2 rounded shadow-lg hover:bg-blue-600">Submit</button>
        </form>
    </section>
</body>
</html>
