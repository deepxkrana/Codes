<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="color: red; text-align: center;">Contact Page</h1>
    <h1>Welcome to My Contact Page</h1>
    <section id="contact">
        <h2>Contact Me</h2>
        <form>
            <label>Name</label>
            <input type="text" name="name" id="name" placeholder="Enter Your Name" required><br></input>
            <br>
            <label>Password</label>
            <input type="password" name="Pass"><br></input>
            <br>
            <label>Email</label>
            <input type="email" name="email" id="email" placeholder="Enter Your Email" required><br></input>
            <br>
            <label>Gender</label>
            <input type="radio" name="gender" value="male">Male</input>
            <input type="radio" name="gender" value="female">Female</input>
            <br><br>
            <label>Country</label>
            <select name="country" id="">
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Canada">Canada</option>
            </select>
            <br>
            <br>
        <label>Message</label>
        <textarea name="message" id="message" cols="30" rows="1" placeholder="Enter Your Message"></textarea>
        <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        </form>
    </section>
</body>
</html>
